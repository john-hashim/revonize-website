<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rovonize Systems brings together UAV platforms, engineering services, precision manufacturing and hands-on technology education in Kerala, India."
    />
    <meta name="theme-color" content="#0b1932" />
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      body { margin: 0; }
      html.is-loading { overflow: hidden; }
      .is-loading #root { opacity: 0; }
      #initial-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; opacity: 1; transition: opacity 240ms ease; }
      #initial-loader.is-complete { opacity: 0; pointer-events: none; }
      .loader-content { width: min(280px, 72vw); text-align: center; }
      .loader-logo { display: block; width: 100%; height: auto; }
      .loader-label { margin: 32px 0 18px; color: #536176; font: 500 14px/1.5 'Inter Variable', system-ui, sans-serif; letter-spacing: .04em; }
      .loader-track { height: 3px; overflow: hidden; border-radius: 3px; background: #e7edf5; }
      .loader-fill { height: 100%; background: #0866e9; transform: scaleX(0); transform-origin: left; transition: transform 180ms ease; }
      @media (prefers-reduced-motion: reduce) { #initial-loader, .loader-fill { transition: none; } }
    </style>
    <script>document.documentElement.classList.add('is-loading')</script>
    <noscript><style>#initial-loader { display: none; }</style></noscript>
    <title>Aerospace, Engineering &amp; Technology | Rovonize Systems</title>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-content">
        <img class="loader-logo" src="/images/rovonize-logo.png" alt="Rovonize" width="338" height="149" fetchpriority="high" />
        <p class="loader-label" role="status">Loading Rovonize</p>
        <div class="loader-track" role="progressbar" aria-label="Loading Rovonize" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="loader-fill"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view Rovonize.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
